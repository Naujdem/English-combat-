# Validar preguntas: se lanza a mano desde GitHub (pestaña Actions → "Validar preguntas" → Run workflow).
# El informe sale en el resumen de la ejecución y como archivo descargable.
name: Validar preguntas
on:
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate -- --lt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validacion
          path: reports/validacion.md
